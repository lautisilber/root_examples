name: Render ROOT plots

on:
  push:
    branches: [main]
    paths:
      - "templates/**.C"   # only run when a macro changes

permissions:
  contents: write          # needed to commit the PNG back

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run macro in ROOT container
        run: |
          docker run --rm -v "$PWD:/work" -w /work/templates \
            rootproject/root:latest \
            root -l -b -q multiplot.C

      # Option A: attach the PNG to the workflow run (downloadable from the Actions tab)
      - uses: actions/upload-artifact@v4
        with:
          name: plots
          path: templates/multiplot.png

      # Option B: commit the PNG to the repo, so it's always up to date on main
      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/multiplot.png
          git diff --cached --quiet || git commit -m "Update multiplot.png [skip ci]"
          git push
